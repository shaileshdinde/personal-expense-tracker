<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/favicon.svg">
  <title>Forgot Password | Expense Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/adminlte/css/adminlte.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo">
    <b><i class="fas fa-wallet mr-1"></i>Expense</b>Tracker
  </div>
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Forgot your password? Enter your email and we'll send you a reset token.</p>

      <div id="alert-box" class="alert d-none" role="alert"></div>

      <form id="forgot-form">
        <div class="input-group mb-3">
          <input type="email" id="email" class="form-control" placeholder="Email" required>
          <div class="input-group-append"><div class="input-group-text"><span class="fas fa-envelope"></span></div></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">
          <span class="btn-text">Send reset token</span>
          <span class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>

      <p class="mt-3 mb-1">
        <a href="reset-password.html">I already have a reset token</a>
      </p>
      <p class="mb-0"><a href="login.html">Back to sign in</a></p>
    </div>
  </div>
</div>

<script src="assets/vendor/jquery/jquery.min.js"></script>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/adminlte/js/adminlte.min.js"></script>
<script src="assets/js/config.js?v=1.0.1"></script>
<script src="assets/js/ui.js?v=1.0.1"></script>
<script src="assets/js/auth.js?v=1.0.1"></script>
<script src="assets/js/api.js?v=1.0.1"></script>
<script>
$(function () {
  Auth.redirectIfLoggedIn();

  $('#forgot-form').on('submit', function (e) {
    e.preventDefault();
    const email = $('#email').val().trim();

    const $btn = $('#submit-btn');
    $btn.prop('disabled', true);
    $btn.find('.btn-text').addClass('d-none');
    $btn.find('.spinner-border').removeClass('d-none');

    Api.post('/api/forgot-password', { email: email })
      .done(function (resp) {
        $('#alert-box').removeClass('d-none alert-danger').addClass('alert-success')
          .text(resp.message + ' Redirecting you to the reset page...');
        setTimeout(function () {
          window.location.href = 'reset-password.html?email=' + encodeURIComponent(email);
        }, 1500);
      })
      .fail(function (resp) {
        $('#alert-box').removeClass('d-none alert-success').addClass('alert-danger')
          .text(UI.apiErrorMessage(resp));
      })
      .always(function () {
        $btn.prop('disabled', false);
        $btn.find('.btn-text').removeClass('d-none');
        $btn.find('.spinner-border').addClass('d-none');
      });
  });
});
</script>
</body>
</html>
