<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | SVL Automations</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            max-width: 650px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .error-code {
            font-size: 100px;
            font-weight: 800;
            line-height: 1;
            color: #2563eb;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 32px;
            margin-bottom: 15px;
        }

        .error-message {
            color: #6b7280;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .footer {
            margin-top: 35px;
            font-size: 13px;
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            .error-container {
                padding: 40px 25px;
            }

            .error-code {
                font-size: 75px;
            }

            .error-title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <div class="error-container">

        <div class="error-code">404</div>

        <h1 class="error-title">Page Not Found</h1>

        <p class="error-message">
            Sorry, the page you are looking for does not exist,
            may have been moved, or is temporarily unavailable.
        </p>

        <div class="buttons">
            <a href="index.html" class="btn btn-primary">
                Go to Homepage
            </a>

            <a href="javascript:history.back()" class="btn btn-secondary">
                Go Back
            </a>
        </div>

        <div class="footer">
            &copy; SVL Automations. All Rights Reserved.
        </div>

    </div>

</body>
</html>
