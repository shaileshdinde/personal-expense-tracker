<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expenses | Expense Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/adminlte/css/adminlte.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <div id="navbar-placeholder"></div>
  <div id="sidebar-placeholder"></div>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2 align-items-center">
          <div class="col-sm-6"><h1 class="m-0">Expenses</h1></div>
          <div class="col-sm-6 text-sm-right">
            <button class="btn btn-primary btn-page-action" id="btn-new-expense">
              <i class="fas fa-plus mr-1"></i> New Expense
            </button>
          </div>
        </div>
      </div>
    </div>

    <section class="content">
      <div class="container-fluid">

        <!-- Filters -->
        <div class="card">
          <div class="card-body">
            <div class="form-row align-items-end">
              <div class="col-6 col-md-2 mb-2">
                <label class="small mb-1 text-muted">Category</label>
                <select class="form-control form-control-sm" id="filter-category">
                  <option value="">All</option>
                </select>
              </div>
              <div class="col-6 col-md-2 mb-2">
                <label class="small mb-1 text-muted">Sub-Category</label>
                <select class="form-control form-control-sm" id="filter-subcategory">
                  <option value="">All</option>
                </select>
              </div>
              <div class="col-6 col-md-2 mb-2">
                <label class="small mb-1 text-muted">From</label>
                <input type="date" class="form-control form-control-sm" id="filter-from">
              </div>
              <div class="col-6 col-md-2 mb-2">
                <label class="small mb-1 text-muted">To</label>
                <input type="date" class="form-control form-control-sm" id="filter-to">
              </div>
              <div class="col-6 col-md-2 mb-2">
                <label class="small mb-1 text-muted">Status</label>
                <select class="form-control form-control-sm" id="filter-status">
                  <option value="active" selected>Active</option>
                  <option value="disabled">Disabled</option>
                  <option value="">All</option>
                </select>
              </div>
              <div class="col-6 col-md-2 mb-2">
                <button class="btn btn-sm btn-outline-secondary btn-block" id="btn-clear-filters">
                  <i class="fas fa-times mr-1"></i>Clear
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body p-0">
            <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>Date / Time</th>
                  <th>Reason</th>
                  <th>Category</th>
                  <th>Payment</th>
                  <th>Status</th>
                  <th class="text-right">Amount</th>
                  <th class="text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="expenses-body">
                <tr><td colspan="7" class="text-center py-4 text-muted">Loading...</td></tr>
              </tbody>
              <tfoot>
                <tr>
                  <td colspan="5" class="text-right font-weight-bold">Total (this page)</td>
                  <td class="text-right font-weight-bold" id="page-total">₹0.00</td>
                  <td></td>
                </tr>
              </tfoot>
            </table>
            </div>
          </div>
          <div class="card-footer pagination-footer d-flex justify-content-between align-items-center">
            <span class="text-muted small" id="pagination-info"></span>
            <nav>
              <ul class="pagination pagination-sm mb-0" id="pagination-controls"></ul>
            </nav>
          </div>
        </div>

      </div>
    </section>
  </div>

  <div id="footer-placeholder"></div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="expense-modal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="expense-form">
        <div class="modal-header">
          <h5 class="modal-title" id="expense-modal-title">New Expense</h5>
          <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="expense_id">
          <div class="form-row">
            <div class="form-group col-md-6">
              <label>Category <span class="required-asterisk">*</span></label>
              <select class="form-control" id="expense_category_id" required></select>
            </div>
            <div class="form-group col-md-6">
              <label>Sub-Category</label>
              <select class="form-control" id="expense_subcategory_id">
                <option value="">None</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-md-8">
              <label>Reason <span class="required-asterisk">*</span></label>
              <input type="text" class="form-control" id="expense_reason" required maxlength="255" placeholder="e.g. Weekly groceries">
            </div>
            <div class="form-group col-md-4">
              <label>Amount <span class="required-asterisk">*</span></label>
              <div class="input-group">
                <div class="input-group-prepend"><span class="input-group-text">₹</span></div>
                <input type="number" step="0.01" min="0" class="form-control" id="expense_amount" required>
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group col-6 col-md-4">
              <label>Date <span class="required-asterisk">*</span></label>
              <input type="date" class="form-control" id="expense_date" required>
            </div>
            <div class="form-group col-6 col-md-4">
              <label>Time <span class="required-asterisk">*</span></label>
              <input type="time" class="form-control" id="expense_time" required>
            </div>
            <div class="form-group col-12 col-md-4">
              <label>Payment Mode <span class="required-asterisk">*</span></label>
              <select class="form-control" id="expense_payment_mode" required>
                <option value="cash">Cash</option>
                <option value="card">Card</option>
                <option value="upi">UPI</option>
                <option value="netbanking">Net Banking</option>
                <option value="wallet">Wallet</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Details</label>
            <textarea class="form-control" id="expense_details" rows="2" maxlength="1000"></textarea>
          </div>
          <div class="form-group">
            <label>Remark</label>
            <input type="text" class="form-control" id="expense_remark" maxlength="255">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="assets/vendor/jquery/jquery.min.js"></script>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/adminlte/js/adminlte.min.js"></script>
<script src="assets/js/config.js?v=1.0.1"></script>
<script src="assets/js/ui.js?v=1.0.1"></script>
<script src="assets/js/auth.js?v=1.0.1"></script>
<script src="assets/js/api.js?v=1.0.1"></script>
<script src="assets/js/layout.js?v=1.0.1"></script>
<script src="assets/js/expenses.js?v=1.0.1"></script>
</body>
</html>
