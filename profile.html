<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile | Expense Tracker</title>
  <link rel="icon" type="image/png" href="assets/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/adminlte/css/adminlte.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <div id="navbar-placeholder"></div>
  <div id="sidebar-placeholder"></div>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <h1 class="m-0">My Profile</h1>
      </div>
    </div>

    <section class="content">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-4">
            <div class="card card-primary card-outline">
              <div class="card-body box-profile text-center">
                <i class="fas fa-user-circle" style="font-size:5rem; color:#4e73df;"></i>
                <h3 class="profile-username mt-2" id="profile-name">-</h3>
                <p class="text-muted mb-1" id="profile-email">-</p>
                <p class="text-muted small" id="profile-since"></p>
              </div>
            </div>
          </div>

          <div class="col-md-8">
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Edit Profile</h3>
              </div>
              <form id="profile-form">
                <div class="card-body">
                  <div id="alert-box" class="alert d-none"></div>
                  <div class="form-group">
                    <label>Name</label>
                    <input type="text" class="form-control" id="name" maxlength="150">
                  </div>
                  <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" id="email" disabled>
                    <small class="text-muted">Email cannot be changed.</small>
                  </div>
                  <div class="form-group">
                    <label>Phone</label>
                    <input type="text" class="form-control" id="phone" maxlength="20">
                  </div>

                  <hr>
                  <h6 class="text-muted">Change Password <span class="text-muted small">(optional)</span></h6>
                  <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" class="form-control" id="current_password" autocomplete="current-password">
                  </div>
                  <div class="form-group">
                    <label>New Password</label>
                    <input type="password" class="form-control" id="password" autocomplete="new-password" minlength="6">
                  </div>
                </div>
                <div class="card-footer text-sm-right">
                  <button type="submit" class="btn btn-primary btn-page-action" id="save-btn">
                    <span class="btn-text">Save Changes</span>
                    <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="footer-placeholder"></div>
</div>

<script src="assets/vendor/jquery/jquery.min.js"></script>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/adminlte/js/adminlte.min.js"></script>
<script src="assets/js/config.js?v=1.0.1"></script>
<script src="assets/js/ui.js?v=1.0.1"></script>
<script src="assets/js/auth.js?v=1.0.1"></script>
<script src="assets/js/api.js?v=1.0.1"></script>
<script src="assets/js/layout.js?v=1.0.1"></script>
<script src="assets/js/profile.js?v=1.0.1"></script>
</body>
</html>
