<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sub-Categories | Expense Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/adminlte/css/adminlte.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <div id="navbar-placeholder"></div>
  <div id="sidebar-placeholder"></div>

  <div class="content-wrapper">
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2 align-items-center">
          <div class="col-sm-6"><h1 class="m-0">Sub-Categories</h1></div>
          <div class="col-sm-6 text-sm-right">
            <button class="btn btn-primary btn-page-action" id="btn-new-subcategory">
              <i class="fas fa-plus mr-1"></i> New Sub-Category
            </button>
          </div>
        </div>
      </div>
    </div>

    <section class="content">
      <div class="container-fluid">
        <div class="card">
          <div class="card-header">
            <div class="row">
              <div class="col-md-4">
                <select class="form-control form-control-sm" id="filter-category">
                  <option value="">All Categories</option>
                </select>
              </div>
              <div class="col-md-8 text-md-right mt-2 mt-md-0">
                <div class="btn-group btn-group-sm flex-wrap" role="group" id="status-filter">
                  <button type="button" class="btn btn-outline-secondary active" data-status="">All</button>
                  <button type="button" class="btn btn-outline-secondary" data-status="active">Active</button>
                  <button type="button" class="btn btn-outline-secondary" data-status="disabled">Disabled</button>
                </div>
              </div>
            </div>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Status</th>
                  <th class="text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="subcategories-body">
                <tr><td colspan="4" class="text-center py-4 text-muted">Loading...</td></tr>
              </tbody>
            </table>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div id="footer-placeholder"></div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="subcategory-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="subcategory-form">
        <div class="modal-header">
          <h5 class="modal-title" id="subcategory-modal-title">New Sub-Category</h5>
          <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="subcategory_id">
          <div class="form-group">
            <label>Category <span class="required-asterisk">*</span></label>
            <select class="form-control" id="subcategory_category_id" required></select>
          </div>
          <div class="form-group">
            <label>Name <span class="required-asterisk">*</span></label>
            <input type="text" class="form-control" id="subcategory_name" required maxlength="100">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="assets/vendor/jquery/jquery.min.js"></script>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/adminlte/js/adminlte.min.js"></script>
<script src="assets/js/config.js?v=1.0.1"></script>
<script src="assets/js/ui.js?v=1.0.1"></script>
<script src="assets/js/auth.js?v=1.0.1"></script>
<script src="assets/js/api.js?v=1.0.1"></script>
<script src="assets/js/layout.js?v=1.0.1"></script>
<script src="assets/js/subcategories.js?v=1.0.1"></script>
</body>
</html>
